name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Cài dependencies frontend
        run: yarn install --frozen-lockfile

      - name: Kiểm tra lint frontend
        run: yarn lint

      - name: Build frontend
        run: yarn build
